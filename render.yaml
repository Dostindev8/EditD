services:
  - type: web
    name: editd-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: ALLOW_MEMORY_QUEUE
        value: "true"
      # Demo durable-enough until Atlas password is real: in-memory Mongo.
      # Set MONGODB_URI to a working Atlas URI and flip this to "false".
      - key: ALLOW_MEMORY_MONGO
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL_LCS
        sync: false
      - key: ADMIN_PASSWORD_LCS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        sync: false
      - key: SELFHOSTED_INFERENCE_URL
        sync: false
      - key: SELFHOSTED_INFERENCE_TOKEN
        sync: false
